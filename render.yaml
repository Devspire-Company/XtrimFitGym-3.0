services:
  - type: web
    name: xtrimfitgym-api
    runtime: node
    rootDir: Api
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run migrate:production
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: XtrimFitGym3
      - key: SESSION_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_APP_ORIGIN
        sync: false
      - key: MEMBER_APP_ORIGIN
        sync: false
      - key: MONITORING_TOKEN
        generateValue: true
